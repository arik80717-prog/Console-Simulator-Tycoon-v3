<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eceff6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Гараж Консолей">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Гараж Консолей</title>
<style>
html{color-scheme:light dark}
/* Layout: landscape phone app. Top status bar (date, stats, cash, time controls), left icon rail for sections,
   a scrolling content area that flows cards into columns, a right-hand drawer for part pickers. */
:root{
  --bg:#eceff6; --surface:#ffffff; --surface2:#e3e8f3; --ink:#141a2e; --mute:#626d88; --line:#d3d9ea;
  --accent:#ff5a2c; --accent-ink:#ffffff; --blue:#2c5bff; --good:#0f9d66; --warn:#d68a00; --bad:#dc3a3a;
  --shadow:0 1px 0 rgba(20,26,46,.06),0 14px 30px -20px rgba(20,26,46,.35);
  --display:'Arial Black','Segoe UI',system-ui,sans-serif;
  --body:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f1e; --surface:#141a32; --surface2:#1e2646; --ink:#e9edfb; --mute:#8d98bb; --line:#262f55;
  --accent:#ff7448; --accent-ink:#1a0a04; --blue:#7b98ff; --good:#3fd69a; --warn:#f0b43a; --bad:#ff6b6b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 30px -20px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f1e; --surface:#141a32; --surface2:#1e2646; --ink:#e9edfb; --mute:#8d98bb; --line:#262f55;
  --accent:#ff7448; --accent-ink:#1a0a04; --blue:#7b98ff; --good:#3fd69a; --warn:#f0b43a; --bad:#ff6b6b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 30px -20px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ic{flex:none;display:block}
.mono{font-family:var(--mono)}
.mute{color:var(--mute)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}

/* frame */
.app{height:100%;max-width:1280px;margin:0 auto;display:grid;grid-template-columns:72px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px 12px;padding-block:8px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;min-width:0;padding:6px 8px 6px 6px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.iconbtn{width:40px;height:40px;border-radius:13px;border:0;background:var(--surface2);display:grid;place-items:center;flex:none}
.t-date{min-width:0;flex:none}
.t-date b{display:block;font:700 14px/1.1 var(--display);white-space:nowrap}
.t-date span{font:500 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.hdl{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.strip{display:flex;gap:6px;min-width:0;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:5px;flex:none;padding:5px 10px;border-radius:99px;background:var(--surface2);font:600 12px var(--mono);font-variant-numeric:tabular-nums}
.pill svg{color:var(--accent)}
.t-cash{margin-left:auto;text-align:right;flex:none}
.t-cash b{display:block;font:700 19px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.t-cash b.neg{color:var(--bad)}
.t-cash span{font:500 10px var(--mono);color:var(--mute);white-space:nowrap}
.tp{display:flex;gap:3px;padding:3px;border-radius:15px;background:var(--ink);flex:none}
.tp button{width:40px;height:36px;border:0;border-radius:12px;background:transparent;color:var(--bg);display:grid;place-items:center}
.tp button.on{background:var(--accent);color:var(--accent-ink)}
.tp button.skip{width:auto;padding:0 10px;display:flex;gap:4px;align-items:center;font:600 11px var(--mono)}
.rail{display:flex;flex-direction:column;gap:4px;padding:5px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);overflow-y:auto;scrollbar-width:none;min-height:0}
.rail::-webkit-scrollbar{display:none}
.rail button{position:relative;flex:1 1 0;min-height:46px;border:0;background:transparent;border-radius:16px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 9.5px var(--body)}
.rail button.on{background:var(--surface2);color:var(--ink)}
.rail button.on svg{color:var(--accent)}
.rail i{position:absolute;top:3px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:700 10px/16px var(--mono);text-align:center;font-style:normal}
.main{overflow-y:auto;min-height:0;min-width:0;padding-right:2px;scrollbar-width:thin}
.page{display:flex;flex-direction:column;gap:12px}
.cols{column-width:260px;column-gap:14px}
.cols>*{break-inside:avoid;margin-bottom:14px}
.cols.build{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-areas:"art parts" "sum parts";gap:14px;align-items:start;column-width:auto}
.cols.build>*{margin-bottom:0}
.a-art{grid-area:art}.a-parts{grid-area:parts}.a-sum{grid-area:sum}
.a-art .art{max-height:170px}

/* content */
.lab{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.card h3{margin:0;font:700 15px/1.2 var(--display);letter-spacing:-.01em}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.tag{display:inline-block;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--mute);vertical-align:middle}
.tag.hot{background:var(--accent);color:var(--accent-ink)}
.tag.blue{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px 12px}
.grid>div{min-width:0}
.grid b{display:block;font:600 14px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.li>div{min-width:0}
.li small{display:block;color:var(--mute);font-size:12px}
.li .v{font:600 13px var(--mono);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.sub{margin:0;color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grow{flex:1}

/* controls */
.btn{border:0;border-radius:14px;min-height:42px;padding:0 14px;background:var(--surface2);font:600 13px var(--body);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.go{background:var(--accent);color:var(--accent-ink)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{min-height:36px;padding:0 11px;border-radius:12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.wide{width:100%}
.seg{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:0;background:transparent;border-radius:12px;padding:8px 14px;font:600 12.5px var(--body);color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:99px;padding:8px 13px;min-height:38px;background:var(--surface2);font:600 12.5px var(--body)}
.chip.on{background:var(--ink);color:var(--bg)}
.step{display:flex;align-items:center;gap:6px}
.step b{min-width:52px;text-align:center;font:700 15px var(--mono);font-variant-numeric:tabular-nums}
.step .btn{width:38px;padding:0}
.meter{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.meter.blue i{background:var(--blue)}.meter.good i{background:var(--good)}
.score{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font:700 14px var(--mono);color:#fff;background:var(--warn)}
.score.good{background:var(--good)}.score.bad{background:var(--bad)}
.art{display:block;width:100%;height:auto;border-radius:14px;background:var(--surface2)}
.hero{background:var(--ink);color:var(--bg);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.hero .lab{color:inherit;opacity:.65}
.hero big{display:block;font:700 30px/1.05 var(--display);letter-spacing:-.03em;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.hero .meter{background:rgba(255,255,255,.18)}
.advice{display:flex;gap:12px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:14px}
.advice h3{color:inherit}.advice p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.advice .btn{background:var(--accent-ink);color:var(--accent);flex:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--surface2);border-radius:14px;padding:10px 12px;min-height:50px}
.opt+.opt,.opt+.optrow,.optrow+.optrow{margin-top:6px}
.opt.on{box-shadow:inset 0 0 0 2px var(--accent)}
.opt:disabled{opacity:.45}
.opt .t{flex:1;min-width:0;font-weight:600}
.opt .t small{display:block;font:500 11px var(--mono);color:var(--mute)}
.optrow{display:flex;gap:6px;align-items:stretch}
.optrow .opt{flex:1}
.part{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 0;min-height:48px}
.part .k{width:92px;flex:none;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.part .n{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach>div{border-radius:14px;padding:9px 11px;font-size:11.5px;line-height:1.35;background:var(--surface2);color:var(--mute)}
.ach>div.ok{background:var(--ink);color:var(--bg)}
.ach b{display:block;font-size:12.5px}
input.in,textarea{width:100%;font:500 14px var(--mono);padding:10px 12px;border:0;border-radius:12px;background:var(--surface2);color:var(--ink);min-height:42px}
textarea{height:110px;font-size:11px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.sw{width:50px;height:28px;border-radius:99px;border:0;background:var(--surface2);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:transform .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(22px);background:var(--accent-ink)}

/* drawer, modal, toasts */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,12,28,.5);display:flex;justify-content:flex-end}
.sheet{width:min(440px,72%);height:100%;display:flex;flex-direction:column;background:var(--bg);border-radius:26px 0 0 26px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)) 16px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px))}
.sheet .grab{display:none}
.sbody{overflow-y:auto;min-height:0;padding-bottom:8px}
.modal{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:flex;padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px))}
.modal>div{margin:auto;width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px}
.modal h1{font:700 30px/1.05 var(--display);letter-spacing:-.03em;margin:0;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.big{font-size:52px;line-height:1}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(72px + env(safe-area-inset-top,0px));z-index:45;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;max-width:min(360px,60%)}
.toast{padding:9px 14px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateX(10px)}}
@media (max-width:760px){.strip .pill:nth-child(3){display:none}.t-date span{display:none}.top{gap:8px}.hdl{gap:8px}}
@media (max-height:420px){.hero big{font-size:26px}.ttl{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* forced landscape: normal fixed root; on a portrait phone the whole game is rotated a quarter turn */
#root{position:fixed;top:0;left:0;right:0;bottom:0;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
@media (orientation:portrait) and (max-width:820px){
  html:not(.norot) #root{right:auto;bottom:auto;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);
    padding:env(safe-area-inset-right,0px) max(16px,env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px) max(16px,env(safe-area-inset-top,0px))}
}
</style>
</head>
<body>
<div id="root"><div class="app"><header class="top"><div class="hdl" id="hdl"></div><div class="tp" id="tp" role="group" aria-label="Время"></div></header><nav class="rail" id="rail" aria-label="Разделы"></nav><main class="main" id="main"></main></div>
<div id="sheet"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="ov"></div></div>
<script>
const START=1985;
const MON=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const CN=['Nintando','Sego','Sonix','Atary','Xbocks','Playstashun','Neo-Geo','Famikom'];
const GA=['Супер','Мега','Ультра','Нео','Турбо','Легендарный','Тёмный','Классический'];
const GN=['Марьо','Соник Рашш','Зелдо','Мортал Файт','Пэкмен','Тетрикс','Файнал Фэнтэзи','Кроссфайр'];
/* w = вес для [процессор, видеочип, память, контроллер] */
const GENRES=[
  {n:'Экшен',w:[1,3,1,3]},{n:'РПГ',w:[1,1,3,1]},{n:'Гонки',w:[2,3,1,3]},{n:'Головоломка',w:[1,0,1,1]},{n:'Спорт',w:[2,2,2,2]}];
const SCOPES=[
  {n:'Малая',cost:9000,mo:2,b:0,mm:.5},{n:'Средняя',cost:28000,mo:4,b:6,mm:1.5},{n:'Большая',cost:85000,mo:7,b:14,mm:3}];
const MK=[{n:'Без рекламы',cost:0,m:1},{n:'Обычная',cost:8000,m:1.15},{n:'Большая',cost:25000,m:1.4}];
/* y = год появления, uc = себестоимость в консоли, rd = цена разработки */
const CAT=[
 {k:'cpu',n:'Процессор',items:[
  {n:'ZX-8 · 8 бит',y:1985,uc:10,rd:5000},{n:'ZX-16 · 16 бит',y:1988,uc:18,rd:9000},{n:'RISC-32 · 32 бита',y:1992,uc:30,rd:16000},
  {n:'Vortex-64 · 64 бита',y:1996,uc:48,rd:28000},{n:'Quad · 4 ядра',y:2000,uc:75,rd:45000},{n:'Hexa · 6 ядер',y:2004,uc:110,rd:70000},{n:'Octa · 8 ядер',y:2009,uc:150,rd:100000}]},
 {k:'gpu',n:'Видеочип',items:[
  {n:'Тайловый чип',y:1985,uc:10,rd:5000},{n:'Спрайтовый 16 бит',y:1989,uc:20,rd:10000},{n:'3D-ускоритель',y:1993,uc:34,rd:18000},
  {n:'Шейдерный GPU',y:1997,uc:55,rd:30000},{n:'HD-графика',y:2001,uc:85,rd:48000},{n:'Унифицированный GPU',y:2005,uc:120,rd:72000},{n:'Трассировка лучей',y:2010,uc:170,rd:105000}]},
 {k:'ram',n:'Оперативная память',items:[
  {n:'8 КБ',y:1985,uc:6,rd:3000},{n:'64 КБ',y:1988,uc:12,rd:6000},{n:'2 МБ',y:1991,uc:22,rd:11000},
  {n:'16 МБ',y:1995,uc:36,rd:19000},{n:'128 МБ',y:1999,uc:55,rd:30000},{n:'512 МБ',y:2003,uc:80,rd:48000},{n:'4 ГБ',y:2008,uc:115,rd:75000}]},
 {k:'media',n:'Носитель игр',items:[
  {n:'Картридж ROM',y:1985,uc:4,rd:3000},{n:'Картридж с батарейкой',y:1987,uc:10,rd:6000},{n:'CD-ROM',y:1993,uc:18,rd:10000},
  {n:'DVD-диск',y:1997,uc:26,rd:16000},{n:'Флеш-карта',y:2001,uc:34,rd:24000},{n:'Blu-ray',y:2005,uc:48,rd:36000},{n:'SSD-модуль',y:2011,uc:70,rd:60000}]},
 {k:'ctl',n:'Контроллер',items:[
  {n:'Джойстик',y:1985,uc:3,rd:2000},{n:'Крестовина, 2 кнопки',y:1985,uc:6,rd:4000},{n:'Геймпад, 6 кнопок',y:1989,uc:10,rd:7000},
  {n:'Геймпад с плечевыми',y:1993,uc:15,rd:11000},{n:'Аналог и вибро',y:1997,uc:22,rd:16000},{n:'Датчики движения',y:2005,uc:32,rd:26000},{n:'Сенсорный экран',y:2010,uc:45,rd:40000}]},
 {k:'des',n:'Корпус',items:[
  {n:'Строгий',y:1985,uc:5,rd:2000,ap:0},{n:'Стильный',y:1985,uc:14,rd:6000,ap:.1},{n:'Премиум',y:1985,uc:30,rd:14000,ap:.22},{n:'Алюминий',y:1995,uc:45,rd:22000,ap:.32},{n:'Лимитированный',y:2005,uc:70,rd:40000,ap:.45}]},
 {k:'snd',n:'Звук',items:[
  {n:'Пищалка',y:1985,uc:2,rd:1000},{n:'Синтезатор, 4 канала',y:1988,uc:6,rd:4000},{n:'Стерео PCM',y:1993,uc:12,rd:9000},
  {n:'Объёмный звук',y:2000,uc:22,rd:20000},{n:'Dolby Surround',y:2007,uc:35,rd:38000}]}
];
const T=['Квантовый','Нейронный','Фотонный','Плазменный','Орбитальный','Гравитонный','Тахионный','Мультиверсный'];
const REN={cpu:['Zylog Z81 · 8 бит','Motorolo 68000 · 16 бит','Intelo 486 · 32 бита','MIPZ R4400 · 64 бита','Athlonn XP · 1 ГГц','Core Duo T2300','Ryzor 7 · 8 ядер'],
gpu:['Atary TIA','Yamaho V9938','3dFX Voodoo','NVidya TNT2','RadeOn 8500 HD','GeForz 8800 GTX','GeForz RTX 2080'],
media:['Картридж ROM','Картридж Save-Batt','CD-ROM Mega','DVD-9','SD-карта Pro','Blu-Ray BD-50','SSD NVMe M.2'],
ctl:['Джойстик Atary 2600','Крестовина Famikom','Геймпад Mega Drive 6B','Геймпад SuperPad SNS','Аналог N65 Rumble','Wimote Motion','Switchy Touch'],
des:['Корпус Classic Grey','Корпус Retro Wood','Корпус Premium Black','Корпус Alu-Silver','Корпус Limited Gold'],
snd:['Beeper PSG','Yamaho YM2612','Stereo Sound Blaster','Dolbi Digital 5.1','DTS HD-Master']};
Object.entries(REN).forEach(([k,a])=>{const it=CAT.find(c=>c.k===k).items;a.forEach((n,i)=>{if(it[i])it[i].n=n})});

function ev(){
  if(!S.cons.length||Math.random()>.07)return 0;

  if(r===1){say('Государственный грант для малого бизнеса: +'+money(15000)+'.');return 15000}
  if(r===2){say('Брак в партии консолей. Расходы на гарантию: '+money(8000)+'.');return -8000}
  const l=Math.round(S.fans*.05);S.fans-=l;say('Конкурент выпустил громкий хит. Фанатов −'+fmt(l)+'.');return 0
}

function act0(a,v){
  if(a==='tab')S.tab=v;
  else if(a==='speed')setSpeed(+v);
  else if(a==='next'){if(S.diff===3)skipMonth()}
  else if(a==='part'){const[k,i]=v.split(':');if(itm(k,+i).y<=yr()&&isRes(k,+i))S.cd[k]=+i}
  else if(a==='price'){S.cd.price=Math.max(50,S.cd.price+ +v)}
  else if(a==='mkt')S.cd.price=Math.round(mktPrice(S.cd)/10)*10;
  else if(a==='cname')S.cd.name=newCName();
  else if(a==='rd'){const c=rdCost(S.cd);if(!S.rd&&S.cash>=c){S.cash-=c;const mo=rdMonths(S.cd);S.rd={...S.cd,left:mo,total:mo};say('Начата разработка «'+S.cd.name+'».')}}
  else if(a==='cp'){const[id,d]=v.split(':');const c=S.cons.find(x=>x.id===+id);if(c)c.price=Math.max(50,c.price+ +d)}
  else if(a==='genre')S.gd.genre=+v;
  else if(a==='scope')S.gd.scope=+v;
  else if(a==='gmk')S.gd.mk=+v;
  else if(a==='gcon')S.gd.con=+v;
  else if(a==='gname')S.gd.name=newGName();
  else if(a==='mkgame')makeGame();
  else if(a==='hire'){if(S.devs<maxDevs()&&S.cash>=8000){S.cash-=8000;S.devs++;bump('hires');say('Нанят разработчик. В команде: '+S.devs+'.')}}
  else if(a==='res'){const[k,i]=v.split(':');if(i==='t'){const t=TECH.find(x=>x.k===k);if(t&&!S.res[k]&&S.br>=t.c){S.br-=t.c;S.res[k]=1;say('Изучено: '+t.n+'.')}}else{const it=itm(k,+i),c=bcost(+i);if(it.y<=yr()&&!isRes(k,+i)&&S.br>=c){S.br-=c;S.res[k+i]=1;say('Изучено: '+it.n+'.')}}}
  else if(a==='off'){const c=S.cons.find(x=>x.id===+v);if(c){c.off=true;say('Консоль «'+c.name+'» снята с продажи.')}}
  else if(a==='on'){const c=S.cons.find(x=>x.id===+v);if(c&&S.cash>=5000){S.cash-=5000;c.off=false;c.low=0;c.peak=0;say('Консоль «'+c.name+'» возвращена в продажу.')}}
  else if(a==='cer'){if(S.cer.step<2)S.cer.step++;else S.cer=null}
  else if(a==='io')menu='io';
  else if(a==='imp'){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#sv').value.trim()))));if(o&&o.cd&&o.gd){localStorage.setItem(KEY,JSON.stringify(o));setSpeed(0);S=load();S.speed=0;menu=false}}catch(e){}}
  else if(a==='ch'&&S.diff===3)runCheat(v);
  else if(a==='dev'&&S.diff===3)S.dev=!S.dev;
  else if(a==='cheat'&&S.diff===3){const el=$('#cheat'),c=el?el.value.trim().toLowerCase():'';if(el){el.value='';el.blur()}
    runCheat(c)}
  else if(a==='camp'){if(S.cash>=15000&&!(S.camp[v]>0)){S.cash-=15000;S.camp[v]=4;bump('camps');say('Рекламная кампания запущена: спрос +30% на 4 мес.')}}
  else if(a==='loan'){if(S.loan<200000){S.loan+=50000;S.cash+=50000;bump('loans');say('Взят кредит 50 000 $.')}}
  else if(a==='repay'){if(S.loan>0&&S.cash>=50000){S.loan-=50000;S.cash-=50000;bump('repaid');say('Погашено 50 000 $ кредита.')}}
  else if(a==='up'){const u=UPS.find(x=>x.k===v),c=u.b*(S.up[v]+1);if(S.up[v]<UPMAX(v)&&S.cash>=c){S.cash-=c;S.up[v]++;say('Улучшение: '+u.n+' до уровня '+S.up[v]+'.')}}
  else if(a==='fire'){if(S.devs>1&&S.proj.length+S.cprj.length<Math.ceil((S.devs-1)/2)){S.devs--;say('Разработчик уволен. В команде: '+S.devs+'.')}}
  else if(a==='cont')menu=false;
  else if(a==='menu'){setSpeed(0);menu=true;cn=false}
  else if(a==='newg'){if(hasSave()&&!cn){cn=true;render();return}cn=false;menu='diff'}
  else if(a==='start'){cn=false;setSpeed(0);S=fresh(+v);save();menu=false}
  else if(a==='back')menu=true;
  else if(a==='acc'){const i=S.offers.findIndex(o=>o.id===+v),o=S.offers[i];if(o&&S.cash>=o.cost){S.cash-=o.cost;S.offers.splice(i,1);S.cprj.push({...o,left:o.mo,total:o.mo});bump('signed');say('Подписан эксклюзивный контракт на «'+o.name+'».')}}
  else if(a==='dec')S.offers=S.offers.filter(o=>o.id!==+v);
  else if(a==='reset'){setSpeed(0);menu='diff'}
  save(); render();
}
function baseQ(g,c){
  const sc=SCOPES[g.scope], w=GENRES[g.genre].w, t=[c.cpu+1,c.gpu+1,c.ram+1,c.ctl+1];
  const fit=w.reduce((s,x,i)=>s+x*t[i],0)/w.reduce((a,b)=>a+b,0)*4;
  return 35+(S.res.t1?3:0)+S.up.qa*2+(Math.min(S.devs,12)*3+Math.max(0,S.devs-12))+sc.b+fit+c.media*sc.mm;
}
const clampQ=x=>Math.min(98,Math.max(20,Math.round(x)));
function gameCost(g){return SCOPES[g.scope].cost+MK[g.mk].cost}
function makeGame(){
  const g=S.gd, cid=g.con??(S.cons[0]&&S.cons[0].id), c=S.cons.find(x=>x.id===cid);
  if(!c||c.off||S.cash<gameCost(g)||S.proj.length>=Math.ceil(S.devs/2))return;
  const sc=SCOPES[g.scope], mo=Math.max(1,sc.mo-Math.floor((S.devs-1)/3));
  S.cash-=gameCost(g);
  S.proj.push({name:g.name,genre:g.genre,con:c.id,q:clampQ(baseQ(g,c)+rnd(-8,10)),mk:MK[g.mk].m,left:mo,total:mo});
  say('Начата работа над «'+g.name+'».'); g.name=newGName();
}
const DIMS=[31,28,31,30,31,30,31,31,30,31,30,31];
const dim=m=>{const y=START+Math.floor(m/12),k=m%12;return k===1&&y%4===0&&(y%100!==0||y%400===0)?29:DIMS[k]};
const dleft=n=>{let t=dim(S.m)-S.day+1,m=S.m;for(let i=1;i<n;i++){m++;t+=dim(m)}return t};
const pdays=p=>Math.max(0,Math.min(100,100*(1-dleft(p.left)/(p.total*30.44))));
let quiet=false;
function tick(){
  if(S.over)return;
  S.dc=(S.dc||0)+1;S.day=(S.day||1)+1;
  if(S.day>dim(S.m)){S.day=1;monthTick();return}
  if(!quiet&&typeof tickHud==='function')tickHud();
}
function skipMonth(){quiet=true;try{let n=0;do{tick();n++}while(S.day!==1&&!S.over&&n<40)}finally{quiet=false}}

/* ---- sound, haptics, toasts ---- */
let AC;
function sfx(k){
  if(!S||!S.set||!S.set.snd)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const q={tap:[[520,.04]],ok:[[660,.07],[880,.09]],win:[[523,.08],[659,.08],[784,.08],[1047,.18]],bad:[[220,.14],[165,.22]]}[k]||[];
    let t=AC.currentTime;
    q.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d});
  }catch(e){}
}
function vib(ms){try{if(S&&S.set&&S.set.vib&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function toast(t){
  const id=ui.tid++;ui.toasts.push({id,t});if(ui.toasts.length>3)ui.toasts.shift();
  const el=$('#toasts');if(el)el.innerHTML=ui.toasts.map(x=>`<div class="toast">${x.t}</div>`).join('');
  setTimeout(()=>{ui.toasts=ui.toasts.filter(x=>x.id!==id);const e=$('#toasts');if(e)e.innerHTML=ui.toasts.map(x=>`<div class="toast">${x.t}</div>`).join('')},3600);
  const w=/🏆|Консоль года|Победа/.test(t);
  sfx(w?'win':/обанкрот|брак|Брак|критик/.test(t)?'bad':'ok');vib(w?[30,40,30]:20);
}

const BODY=['#8a90a2','#2c5bff','#1c2033','#c8cedb','#d9a93b'];
function art(d){

  const w=150+Math.min(8,d.cpu)*6, x=120-w/2, r=des>=3?26:10, m=d.media||0;
  const slot=m<=1?'<rect x="102" y="14" width="36" height="30" rx="4" fill="#363b52"/><rect x="106" y="18" width="28" height="13" rx="2" fill="#ff5a2c"/>'
    :m<=4?'<circle cx="120" cy="44" r="17" fill="#e1e5f1"/><circle cx="120" cy="44" r="5" fill="#6a728c"/>'
    :'<rect x="92" y="40" width="56" height="5" rx="2.5" fill="#10142a"/>';
  const bar=(v,y)=>`<rect x="${x+16}" y="${y}" width="${Math.min(60,10+v*6)}" height="5" rx="2.5" fill="#fff" opacity=".85"/>`;
  const n=Math.min(6,2+(d.ctl||0));

  if((d.ctl||0)===0)pad='<circle cx="120" cy="117" r="7" fill="#2a2f45"/><path d="M120 117l12-11" stroke="#2a2f45" stroke-width="4" stroke-linecap="round"/>';
  else{let b='';for(let k=0;k<n;k++)b+=`<circle cx="${112+(k%3)*9}" cy="${112+Math.floor(k/3)*9}" r="3" fill="${k%2?'#ff5a2c':'#e1e5f1'}"/>`;
    pad=`<rect x="76" y="102" width="88" height="22" rx="11" fill="#2a2f45"/><path d="M92 107v12M86 113h12" stroke="#e1e5f1" stroke-width="3" stroke-linecap="round"/>${b}`}
  return `<svg class="art" viewBox="0 0 240 130" role="img" aria-label="Консоль «${d.name||''}»"><rect x="${x}" y="46" width="${w}" height="46" rx="${r}" fill="${col}"/><rect x="${x}" y="82" width="${w}" height="10" rx="${Math.min(r,5)}" fill="#000" opacity=".16"/>${slot}${bar(d.cpu||0,56)}${bar(d.gpu||0,65)}${bar(d.ram||0,74)}<circle cx="${x+w-16}" cy="58" r="3.5" fill="#3fd69a"/>${pad}</svg>`;

/* ---- charts ---- */
function spark(h,hgt=64){
  if(!h||h.length<2)return `<p class="note">График появится через пару месяцев.</p>`;
  const mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1,pt=h.map((v,i)=>[(i*300/(h.length-1)),hgt-6-(hgt-12)*(v-mn)/r]);
  const ln=pt.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),e=pt[pt.length-1];
  return `<svg viewBox="0 0 300 ${hgt}" width="100%" style="display:block" aria-hidden="true"><polygon points="0,${hgt} ${ln} 300,${hgt}" fill="currentColor" opacity=".16"/><polyline fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" points="${ln}"/><circle cx="${e[0]}" cy="${e[1].toFixed(1)}" r="4.5" fill="currentColor"/></svg>`;
}

/* ---- forecast & advice ---- */
function forecast(d){
  const c={power:power(d),mp:mktPrice(d),price:d.price,ap:appeal(d)};
  const at=Math.min(1.5,Math.max(.25,c.power/expected())),pf=Math.min(2.2,Math.pow(c.mp/c.price,1.4)),gf=.4+Math.min(1.4,3*.12)*(.6+65/150);
  return Math.floor(800*Math.pow(at,1.5)*pf*gf*c.ap*(1+Math.min(S.fans,9000)/3000)*DIFF[S.diff].sale*1.05*(1+.08*S.up.mk));
}
function advise(){
  const act=S.cons.filter(c=>!c.off);
  if(!S.cons.length&&!S.rd)return{t:'Соберите первую консоль',d:'Выберите детали и цену, затем запустите разработку.',tab:'c',sub:'new',b:'Собрать'};
  if(!S.cons.length)return{t:'Консоль в разработке',d:'До релиза '+dleft(S.rd.left)+' дн. Включите ×3, чтобы быстрее.'};
  if(S.cash<15000&&S.diff!==3)return{t:'Деньги на исходе',d:'Возьмите кредит или запустите рекламу консоли.',tab:'s',sub:'fin',b:'Финансы'};
  if(S.offers.length)return{t:'Есть контракт на эксклюзив',d:S.offers[0].name+' · оценка '+(S.offers[0].q/10).toFixed(1),tab:'g',sub:'con',b:'Смотреть'};
  if(act.length&&S.proj.length<Math.ceil(S.devs/2)&&S.cash>=9000)return{t:'Разработчики свободны',d:'Игры продают консоли. Запустите новую.',tab:'g',sub:'dev',b:'Новая игра'};
  if(canRes())return{t:'Мозги простаивают',d:'Изучите новую технологию для следующей консоли.',tab:'s',sub:'lab',b:'В лабораторию'};
  if(act.length&&Math.max(...act.map(c=>c.power))/expected()<.8&&!S.rd)return{t:'Консоли устаревают',d:'Соберите новое поколение, пока спрос не упал.',tab:'c',sub:'new',b:'Собрать'};
  return{t:'Всё идёт по плану',d:'Следите за трендом рынка и продажами.'};
}

  tab:v=>{S.tab=v;toTop()},
  sub:v=>{ui.sub[S.tab]=v},
  go:v=>{const[t,s]=v.split(':');S.tab=t;if(s&&s!=='undefined')ui.sub[t]=s;toTop()},
  sheet:v=>{ui.sheet=v},sheetx:()=>{ui.sheet=null},
  af:v=>{ui.af=v},rotset:()=>{S.set.rot=S.set.rot===0?1:0},
  snd:()=>{S.set.snd=S.set.snd?0:1},vibt:()=>{S.set.vib=S.set.vib?0:1},
  expo:v=>{const e=EXPO[+v];if(!e||S.cash<e[1])return;S.cash-=e[1];S.fans+=e[2];if(e[3])S.cons.forEach(c=>{if(!c.off)S.camp[c.id]=Math.max(S.camp[c.id]||0,e[3])});if(+v===2)S.br+=10;S.xp=S.expo.y;S.expo=null;bump('expo');say(e[1]?'Выставка: '+e[0].toLowerCase()+'. Фанатов +'+fmt(e[2])+'.':'Выставку пропустили.')}
};
UA.dil=v=>{const e=DIL[S.dil-1];if(e&&e.o[+v]){e.o[+v][1]();S.dil=0;bump('dil')}};
const _vH=vH;vH=()=>questCard()+_vH();
function act(a,v){
  if(UA[a]){UA[a](v);sfx('tap');save();render();return}
  if(a==='part')ui.sheet=null;
  act0(a,v);sfx('tap');
}
let lastTp='';
function render(){
  document.documentElement.classList.toggle('norot',S.set&&S.set.rot===0);
  $('#hdl').innerHTML=HEADL();
  const tk=S.speed+':'+(S.dev?1:0)+':'+S.diff;if(tk!==lastTp){$('#tp').innerHTML=TP();lastTp=tk}
  const sb=$('#sheet .sbody'),st=sb?sb.scrollTop:0;
  if(!(document.activeElement&&document.activeElement.id==='cheat'))$('#main').innerHTML=({h:vH,c:vC,g:vG,w:vW,s:vS}[S.tab]||vH)();
  $('#rail').innerHTML=RAIL();
  $('#sheet').innerHTML=ui.sheet?SHEET():'';
  const nb=$('#sheet .sbody');if(nb)nb.scrollTop=st;
  $('#ov').innerHTML=menu?MENU():S.cer?CER():S.expo?EXPOV():S.dil?DILV():S.over?`<div class="modal"><div><h1>Банкротство</h1><p class="sub" style="margin:0">Студия закрыта в ${label(S.m)}. Продано консолей: ${fmt(sold())}.</p><button class="btn go wide" data-a="reset">Начать заново</button></div></div>`
    :'';
}
document.addEventListener('click',e=>{
  try{if(!window.__ol&&screen.orientation&&screen.orientation.lock){window.__ol=1;screen.orientation.lock('landscape').catch(()=>{})}}catch(x){}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(b.classList.contains('scrim')&&e.target!==b)return;
  act(b.dataset.a,b.dataset.v);
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Enter')act('cheat');return}
  if(e.target.tagName==='TEXTAREA'||menu||e.code!=='Space')return;
  e.preventDefault();act('speed',S.speed?0:1);
});
S=load();S.speed=0;render();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script>
</body>
